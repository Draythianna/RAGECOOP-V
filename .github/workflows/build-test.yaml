name: Build test

on:
  push:
    branches:    
      - '*'         # matches every branch that doesn't contain a '/'
      - '*/*'       # matches every branch containing a single '/'
      - '**'        # matches every branch
      - '!main'     # excludes main
      - '!dev-nightly'     # excludes nightly

  pull_request:
    branches: [ "main", "dev-nightly" ]

  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['6.0.x']

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version:  ${{ matrix.dotnet-version }}
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore nuget packages
      run: nuget restore
    - name: Build client and installer
      shell: pwsh
      run: |
        dotnet build RageCoop.Client.Installer/RageCoop.Client.Installer.csproj --configuration Release -o bin/Release/Client/RageCoop 2>&1 | Tee-Object build.log
        $code = $LASTEXITCODE
        Select-String -Path build.log -Pattern 'error' | Where-Object { $_.Line -notmatch 'warning' } | ForEach-Object { $_.Line.Trim() } | Select-Object -Unique -First 9 | ForEach-Object { Write-Output "::error::$_" }
        exit $code
    - name: Build server win-x64
      run: dotnet build RageCoop.Server/RageCoop.Server.csproj -o bin/Release/Server
    - name: Upload server
      uses: actions/upload-artifact@v4
      with:
        name: RageCoop.Server
        path: bin/Release/Server
    - name: Upload Client
      uses: actions/upload-artifact@v4
      with:
        name: RageCoop.Client
        path: bin/Release/Client
