name: Build test

on:
  push:
    branches:    
      - '*'         # matches every branch that doesn't contain a '/'
      - '*/*'       # matches every branch containing a single '/'
      - '**'        # matches every branch
      # The six release branches are built and tested by Release build instead.
      - '!main'
      - '!dev-nightly'
      - '!last-rel-nightly'
      - '!enhanced_main'
      - '!enhanced_dev-nightly'
      - '!enhanced_last-rel-nightly'

  pull_request:
    branches: [ "main", "dev-nightly" ]

  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: ['6.0.x']

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version:  ${{ matrix.dotnet-version }}
    - name: Restore dependencies
      run: dotnet restore
    - name: Restore nuget packages
      run: nuget restore
    - name: Build client and installer
      run: dotnet build RageCoop.Client.Installer/RageCoop.Client.Installer.csproj --configuration Release -o bin/Release/Client/RageCoop
    - name: Build server win-x64
      run: dotnet build RageCoop.Server/RageCoop.Server.csproj --configuration Release -o bin/Release/Server
    - name: Check GTA math types load on the server
      run: dotnet run --project tests/ShvdnStubCheck -c Release -- bin/Release/Server
    - name: Smoke test server with a resource
      shell: pwsh
      run: ./tests/smoke-server.ps1 -ServerDir bin/Release/Server
    - name: Upload server
      uses: actions/upload-artifact@v4
      with:
        name: RageCoop.Server
        path: bin/Release/Server
    - name: Upload Client
      uses: actions/upload-artifact@v4
      with:
        name: RageCoop.Client
        path: bin/Release/Client
